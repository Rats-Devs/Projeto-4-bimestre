<!DOCTYPE html>
<html lang="pt-br">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <title>Cinemax</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
  <div class="alinhar-nav">

    <h1 class="logo">CINEMAX</h1>

    <nav>
      <ul>
        <li><a href="principal.html">Inicio</a></li>
        <li>
          <a href="login.html">
            <button class="login">
                    <svg class="svgIcon" viewBox="0 0 448 512" xmlns="http://w3.org">
                        <path d="M224 256c70.7 0 128-57.3 128-128S294.7 0 224 0 96 57.3 96 128s57.3 128 128 128zm89.6 32h-16.7c-22.2 10.2-46.9 16-72.9 16s-50.6-5.8-72.9-16h-16.7C60.2 288 0 348.2 0 422.4V464c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48v-41.6c0-74.2-60.2-134.4-134.4-134.4z"></path>
                    </svg>
            </button>
          </a>
        </li>
      </ul>
    </nav>

  </div>
</header>
<div class="movie">
    <div class="info">

        <img id="poster" class="poster">

        <div class="sinopse">

            <h1 id="nomeFilme"></h1>

            <h2>Sinopse</h2>
            <p id="sinopse"></p>

            <div class="info-filme">
                <div id="classificacao" class="classificacao-10"></div>

                <span id="duracao" class="badge"></span>
                <span id="genero" class="badge"></span>
                <span id="diretor" class="badge"></span>
                <span id="anoLancamento" class="badge"></span>
            </div>

        </div>

    </div>

    <div class="horarios">
    <h2>Horários</h2>

        <div class="sessoes">
        <button class="sessao">12:00</button>
        <button class="sessao">15:30</button>
        <button class="sessao">19:00</button>
        </div>
    </div>
</div>

<a href="principal.html">
    <button class="ingresso">Comprar ingresso</button>
</a>
    <footer>
        <p>&copy; 2026 Cinemax. Todos os direitos reservados.</p>
    </footer>
<script>
    const sessoes = document.querySelectorAll(".sessao")
    sessoes.forEach(botao => {
    botao.addEventListener("click", () => {
    sessoes.forEach(b => b.classList.remove("ativa"))
    botao.classList.add("ativa")
})
})
</script>

<script src="detalhes.js"></script>

</body>
</html>
